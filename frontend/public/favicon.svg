<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  fill="none"
>
  <defs>
    <linearGradient id="chatIconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="chatIconStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#cbd5e1" />
    </linearGradient>
    <filter id="chatIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rounded container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#chatIconBgGrad)" />
  
  <!-- Inner Chat Bubble outline path with smooth corner -->
  <path
    d="M28 35C28 31.134 31.134 28 35 28H65C68.866 28 72 31.134 72 35V57C72 60.866 68.866 64 65 64H44L30 74V64H35C31.134 64 28 60.866 28 57V35Z"
    fill="rgba(255, 255, 255, 0.12)"
    stroke="rgba(255, 255, 255, 0.25)"
    strokeWidth="2.5"
  />
  
  <!-- Intersecting dashboard compass/orbit rings -->
  <circle cx="50" cy="50" r="14" stroke="rgba(255, 255, 255, 0.3)" strokeWidth="1.5" strokeDasharray="3 3" />
  
  <!-- Flared 4-pointed guiding star in the center with glow -->
  <path
    d="M 50 30 Q 50 50 30 50 Q 50 50 50 70 Q 50 50 70 50 Q 50 50 50 30 Z"
    fill="url(#chatIconStarGrad)"
    filter="url(#chatIconGlow)"
  />
  
  <!-- Central compass eye -->
  <circle cx="50" cy="50" r="3.5" fill="#10b981" />
</svg>